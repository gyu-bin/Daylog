<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- Daylog 메뉴 막대 아이콘(A안): 잎사귀 하나. 템플릿 이미지라 색은 쓰지 않고 알파만 쓴다. -->
  <!-- 잎: 오른쪽 위를 향한 통통한 실루엣에서 잎맥 하나를 파낸다(evenodd). 1배율 화면에서도 뭉개지지 않게
       잎맥은 1.3pt 폭으로 짧게 둔다. 시각적 무게가 시스템 아이콘(Wi-Fi, 배터리)과 비슷하도록 16pt 안에 맞춘다. -->
  <path fill="#000" fill-rule="evenodd" d="
    M2.2 15.8
    C1.6 9.2 5.4 2.8 15.6 2.4
    C15.9 11.2 10.9 16.3 2.2 15.8 Z
    M4.3 14.1
    L12.9 5.3 L13.8 6.2 L5.2 15.0 Z" />
</svg>
