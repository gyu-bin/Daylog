<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- Daylog 메뉴 막대 아이콘: 잎사귀(아래 왼쪽)와 해(위 오른쪽). 템플릿 이미지라 색은 쓰지 않고 알파만 쓴다. -->
  <!-- 잎: 통통한 윤곽에서 가는 잎맥을 파낸다(evenodd). 1배율 화면에서도 뭉개지지 않게 잎맥은 짧게 둔다. -->
  <path fill="#000" fill-rule="evenodd" d="
    M1.6 16.6
    C0.8 9.6 4.9 5.2 11.4 6.0
    C12.2 12.9 8.0 17.1 1.6 16.6 Z
    M3.8 15.0
    L8.9 9.2 L9.5 9.8 L4.4 15.6 Z" />
  <!-- 해: 원판과 짧은 빛 세 개. -->
  <circle cx="14.6" cy="3.8" r="2.2" fill="#000" />
  <path fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" d="
    M14.6 0.6 L14.6 0.8
    M17.6 3.8 L17.4 3.8
    M16.8 1.6 L16.7 1.7" />
</svg>
