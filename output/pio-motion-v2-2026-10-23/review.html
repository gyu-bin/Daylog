<!doctype html><meta charset="utf-8"><title>Pio motion review v2</title><style>body{background:#172823;color:#f3efd9;font:17px system-ui;max-width:1050px;margin:36px auto;padding:12px}select,button{font:inherit;padding:8px;background:#27473a;color:inherit;border:1px solid #72916f;border-radius:8px}img{max-width:100%;height:auto;display:block}a{color:#badb9e}small{display:block;line-height:1.6}video{max-width:100%}</style><h1>Pio 동작 검토 v2</h1><p>14종 · 기존 8동작 + 걷기·인사 숙임·의상별 제스처</p><small>오프라인 시안 / 앱 구현·성능 PASS 아님. 손에 든 물건은 손과 함께 움직이며 내려놓거나 놓아주지 않습니다. 한 번에 한 동작만 표시합니다.</small><p><select id="outfit"></select> <select id="action"></select> <button id="replay">다시 보기</button></p><img id="motion" width="480" height="516"><p><a id="contact">전체 동작 정지 비교</a> · <a href="README.md">제약·검증 안내</a></p><script>const names=["halloween", "cherryBlossom", "autumn", "rainyDay", "student", "basic", "astronaut", "christmas", "winter", "cafe", "hanbok", "fitness", "pajamas", "summerVacation"];const actions=["idle", "bounce", "jump", "celebrate", "greet", "sleepy", "surprised", "encourage", "walk", "bow", "special"];names.forEach(n=>outfit.add(new Option(n,n)));actions.forEach(n=>action.add(new Option(n,n)));function play(){motion.src=outfit.value+'/'+action.value+'.png';contact.href=outfit.value+'/eleven-actions-contact.png';}outfit.onchange=action.onchange=play;replay.onclick=()=>{motion.src='';requestAnimationFrame(play)};play()</script>
